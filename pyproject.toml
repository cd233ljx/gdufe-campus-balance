[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cardsclaim"
version = "0.4.0"
description = "A convenient Windows desktop toolbox for GDUFE students"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "aiohttp==3.14.3",
  "playwright==1.63.0",
  "pystray==0.19.5",
  "Pillow==12.3.0",
]

[project.urls]
Repository = "https://github.com/cd233ljx/gdufe-campus-balance"
Issues = "https://github.com/cd233ljx/gdufe-campus-balance/issues"

[tool.setuptools.packages.find]
include = ["cardsclaim*"]
